name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build, Publish & Deploy to Nomad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Nomad CLI
        uses: hashicorp/setup-nomad@v1
        with:
          version: '1.7.2'

      - name: Validate Parameterized Nomad Job Template
        run: |
          nomad job validate -var="environment=production" -var="image_tag=${{ github.sha }}" deployment/nomad/linkedin-console.nomad.hcl

      - name: Deploy to Nomad Cluster (when configured)
        if: env.NOMAD_ADDR != ''
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: |
          nomad job run -var="environment=production" -var="image_tag=${{ github.sha }}" deployment/nomad/linkedin-console.nomad.hcl
